name: sti_evoter
description: STI eVoter - student election app (UI prototype with mock data).
publish_to: none
version: 1.0.8+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.6.0
  file_picker: 13.4.1
  package_info_plus: any
  crypto: ^3.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  image_path: "assets/logo.jpg"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/logo.jpg"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#FFE500"
    theme_color: "#1E5AA8"