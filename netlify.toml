[build]
  publish = "download-site"
  command = "echo Static download page, no build needed"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
